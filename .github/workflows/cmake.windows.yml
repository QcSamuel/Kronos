name: Generate Windows Installer

on:
  push:
    branches: [ kronos-cmake_ci ]
  pull_request:
    branches: [ kronos-cmake_ci ]
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  # CMake 4.x removed compatibility with cmake_minimum_required < 3.5.
  # Set as an env var so nested ExternalProject configures (e.g. m68kmake) inherit it.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # Upstream commit 1d32cadb changed vidcs.c to use struct fields that were never added
    # to the headers. This adds them (idempotent). Remove this step once upstream fixes it.
    - name: Patch missing struct fields
      shell: python {0}
      run: |
        import os, re, sys, pathlib
        root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])

        def patch(rel, pattern, repl, marker):
            p = root / rel
            s = p.read_bytes().decode('utf-8', errors='surrogateescape')
            if marker in s:
                print('already patched:', rel)
                return
            new, n = re.subn(pattern, repl, s, count=1, flags=re.S)
            if n != 1:
                sys.exit('PATTERN NOT FOUND in ' + rel)
            p.write_bytes(new.encode('utf-8', errors='surrogateescape'))
            print('patched:', rel)

        patch('yabause/src/sys/vdp1/include/vdp1.h',
              r'(u16 userclipY2;)(\r?\n)',
              r'\1\2   u16 userclipMode;\2', 'userclipMode')

        patch('yabause/src/core/video/opengl/common/include/vidshared.h',
              r'(u8 alpha_per_line\[270\];)(\r?\n)',
              r'\1\2   u32 bitmap_base;\2   u32 bitmap_wrap_size;\2', 'bitmap_wrap_size')

        patch('yabause/src/core/video/opengl/common/include/ygl.h',
              r'(int colorRamIndexFull\[512\];)(\r?\n)',
              r'\1\2   int sprite_rgb_priority_per_line[1024];\2   u8 msb_shadow_enabled_per_line[1024];\2',
              'sprite_rgb_priority_per_line')

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        modules: 'all'
    - name: Download SDL2
      shell: pwsh
      run: |
          Invoke-WebRequest -OutFile SDL2.zip -Uri https://github.com/libsdl-org/SDL/releases/download/release-2.30.8/SDL2-devel-2.30.8-VC.zip
    - name: Install SDL2
      shell: pwsh
      run: |
          Expand-Archive -Force SDL2.zip .\
          mv SDL2-2.30.8 ${{github.workspace}}/SDL2
          rm SDL2.zip
    - name: Configure CMake
      env:
        sdl2lib_DIR: ${{github.workspace}}\SDL2
        sdl2_DIR: ${{github.workspace}}\SDL2\cmake
      run: |
        cmake -S ${{github.workspace}}/yabause -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DYAB_IS_WIP=ON "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

    # The runner image no longer ships NSIS, which CPack needs to make the .exe installer.
    - name: Install NSIS
      shell: pwsh
      run: |
        choco install nsis -y --no-progress
        "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

    - name: Build
      run: |
        echo "Compiling"
        cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target package

    - name: Prepare package
      id: rename
      shell: bash
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c 1-7)
        NAME=$(find build/ -maxdepth 1 -iname "kronos-*.exe")
        mv $NAME kronos-win64-$SHORT_SHA.exe
        echo "ReleaseFile=kronos-win64-$SHORT_SHA.exe" >> "$GITHUB_ENV"
        echo "ArtifactName=kronos-win64-$SHORT_SHA" >> "$GITHUB_ENV"
    - name: Binary upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.ArtifactName}}
        path: ${{env.ReleaseFile}}
